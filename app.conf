# Operational tuning knobs. Loaded once at startup — restart the app after
# editing. All time values are in seconds. Each event picks a fresh random
# value uniformly from [min, max].

[delays]
# Wait before re-sending a message to the paired account.
relay_min = 1
relay_max = 5

# Wait before marking an incoming message as "seen" in Telegram.
mark_read_min = 1
mark_read_max = 3
